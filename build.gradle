    'com/water/utils/renderer/Outline2DRenderer.java',
    'com/water/utils/renderer/ProjectionUtil.java',
    'com/water/utils/renderer/Rectangle2DRenderer.java',
    'com/water/utils/renderer/Texture2DRenderer.java',
    'com/water/utils/renderer/WaterFontRenderer.java'
]

sourceSets {
    main {
        java {
            exclude recoveredBytecodeFallbacks
        }
    }
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'water-refmap.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

processResources {
    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

tasks.named('jar', Jar) {
    from('src/main/prebuilt') {
        exclude 'com/water/mixin/AbstractClientPlayerEntityMixin.class'
        exclude 'com/water/mixin/AutoMineMixin.class'
        exclude 'com/water/mixin/EntityMixin.class'
        exclude 'com/water/mixin/LivingEntityMixin.class'
    }
}
